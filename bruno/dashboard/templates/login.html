{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<div class="login card">
  <h1>Bruno<span style="color:var(--accent)">.</span></h1>
  {% if first_run %}
    <p class="muted">Welcome! Create the dashboard password for {{ s.restaurant_name }}.</p>
  {% endif %}
  <form method="post" action="/admin/login">
    <label>{{ "New password" if first_run else "Password" }}</label>
    <input type="password" name="password" autofocus required>
    <p><button class="primary" type="submit">{{ "Create & continue" if first_run else "Sign in" }}</button></p>
  </form>
</div>
{% endblock %}
