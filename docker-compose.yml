# One command to run Bruno with Postgres:
#   docker compose up -d     -> open http://localhost:8000
# Then paste your API keys on the Settings page.
services:
  bruno:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://bruno:bruno@postgres:5432/bruno
      # Optional: PUBLIC_BASE_URL, ADMIN_PASSWORD, SECRET_KEY (see .env.example)
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bruno
      POSTGRES_PASSWORD: bruno
      POSTGRES_DB: bruno
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bruno"]
      interval: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
