[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bruno"
version = "0.1.0"
description = "Autonomous omnichannel outbound sales & re-engagement agent for local restaurants"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "openai>=1.40",
    "anthropic>=0.40",
    "celery[redis]>=5.3",
    "tzdata",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["bruno*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
